name: Deploy to wesleyzjones.com

# Every push to main builds the site and publishes it to the Cloudflare Pages
# project below, which serves https://wesleyzjones.com. Until the two secrets
# exist the job finishes green with a notice instead of failing.
#
# One-time setup: docs/DEPLOYMENT.md

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: wesleyzjones

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings > Secrets and variables > Actions). Steps: docs/DEPLOYMENT.md"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        working-directory: react-app

      - name: Lint
        if: steps.secrets.outputs.ready == 'true'
        run: npm run lint
        working-directory: react-app

      # No DEPLOY_TARGET: base path "/" and no 404.html, so Cloudflare Pages
      # serves index.html for client-side routes like /projects/utilityhub.
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run build
        working-directory: react-app

      - name: Create the Pages project if it does not exist yet
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main \
            || echo "Project $CF_PAGES_PROJECT already exists (or could not be created); continuing to deploy."

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy react-app/dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
